name: Build Xiaomi 11 Ultra (star) Kernel with SukiSU-Ultra + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "内核源码分支 (小米 MiCode/Xiaomi_Kernel_OpenSource)"
        required: true
        default: "star-r-oss"
      ksu_branch:
        description: "SukiSU-Ultra 分支"
        required: true
        default: "susfs-dev"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libssl-dev libelf-dev cpio kmod \
            bc rsync libncurses-dev wget unzip
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.0/clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          sudo tar -xf clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C /opt
          echo "/opt/clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-18.04/bin" >> $GITHUB_PATH
          clang --version

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource src
          cd src
          DEFCONFIG=$(ls arch/arm64/configs/ | grep -iE 'star|lahaina' | head -1)
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          cd ..

      - name: 集成 SukiSU-Ultra (susfs-dev 内置 SUSFS)
        run: |
          cd src
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/setup.sh" -o setup.sh
          chmod +x setup.sh
          ./setup.sh ${{ github.event.inputs.ksu_branch }}
          cd ..

      - name: 编译内核
        run: |
          cd src
          scripts/config --file arch/arm64/configs/${DEFCONFIG} \
            --set-val CONFIG_KALLSYMS y \
            --set-val CONFIG_KALLSYMS_ALL y \
            --set-val CONFIG_KPM y || true
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- ${DEFCONFIG}
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- Image dtbs 2>&1 | tee build.log
          cd ..

      - name: AnyKernel3 打包
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel_tmp
          cp src/arch/arm64/boot/Image anykernel_tmp/
          # 复制匹配 star/lahaina 的 dtb (若存在)
          mkdir -p anykernel_tmp/dtb
          find src/arch/arm64/boot/dts -name '*.dtb' 2>/dev/null | \
            grep -iE 'star|lahaina' | xargs -I{} cp {} anykernel_tmp/dtb/ || true
          cd anykernel_tmp && zip -r9 ../Xiaomi11Ultra-star-SukiSU-Ultra-SUSFS.zip . && cd ..

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi11Ultra-star-SukiSU-Ultra-SUSFS
          path: Xiaomi11Ultra-star-SukiSU-Ultra-SUSFS.zip
